<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-LOTTO NEURAL ANALYZER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="scanner-line"></div>
    <div class="noise"></div>
    
    <main class="terminal">
        <header class="terminal-header">
            <div class="header-left">
                <div class="status-dot"></div>
                <span class="system-title">SYSTEM: NEURAL_LOTTO_v3.1.0</span>
            </div>
            <div class="header-right">
                <button id="mode-toggle" class="mode-toggle">TOGGLE_MODE</button>
                <span class="system-time" id="clock">00:00:00</span>
            </div>
        </header>

        <section class="display-panel">
            <div id="output-stream" class="output-stream">
                <div class="system-msg">> SYSTEM INITIALIZED...</div>
                <div class="system-msg">> DARK_MODE ENABLED...</div>
            </div>
            
            <div id="result-grid" class="result-grid">
                <!-- 5 rows of numbers will be injected here -->
            </div>
        </section>

        <footer class="terminal-footer">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <button id="trigger-btn" class="glitch-btn">INITIATE_PREDICTION</button>
        </footer>
    </main>

    <script src="main.js"></script>
</body>
</html>
